name: Update public cycling feed
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
  push:
    branches: [main]
    paths: ['collect.py', 'display.py', 'calendar.json', 'requirements.txt', '.github/workflows/publish.yml']
permissions:
  contents: write
concurrency:
  group: public-cycling-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decide whether a refresh is due
        id: due
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "run=$(python display.py)" >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.due.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
      - name: Collect and preserve failures
        if: steps.due.outputs.run == 'true'
        id: collect
        run: |
          status=0
          python collect.py || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Publish factual JSON
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public women cycling feed'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report source failures
        if: steps.due.outputs.run == 'true' && steps.collect.outputs.status != '0'
        run: exit 1
